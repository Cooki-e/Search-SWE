services:
  main:
    cpu_period: 100000
    cpu_quota: 800000
    volumes:
    - type: bind
      source: ../data/corpus
      target: /task/data/corpus
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./docs
      target: /task/docs
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/validation
      target: /task/data/validation
      read_only: true
      bind:
        create_host_path: false
