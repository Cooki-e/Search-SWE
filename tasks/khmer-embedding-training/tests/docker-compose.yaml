services:
  main:
    cpu_period: 100000
    cpu_quota: 800000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - type: bind
        source: ../data/corpus.parquet
        target: /task/data/corpus.parquet
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../models/multilingual-e5-large
        target: /task/models/multilingual-e5-large
        read_only: true
        bind:
          create_host_path: false
