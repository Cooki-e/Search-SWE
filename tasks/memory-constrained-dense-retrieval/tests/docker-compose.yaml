services:
  main:
    cpus: 16
    ipc: private
    mem_limit: 512m
    memswap_limit: 512m
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    tmpfs:
      - /task/index:rw,exec,nosuid,nodev,size=67108864,uid=10001,gid=10001,mode=0750
    volumes:
      - type: bind
        source: ../data/vectors.f32
        target: /task/data/vectors.f32
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../data/metadata.jsonl
        target: /task/data/metadata.jsonl
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../data/vector_config.json
        target: /task/data/vector_config.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../environment/docs
        target: /task/docs
        read_only: true
        bind:
          create_host_path: false
