services:
  main:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - type: bind
        source: ../data/corpus.jsonl
        target: /task/data/corpus.jsonl
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../models/bge-base-en-v1.5
        target: /task/models/bge-base-en-v1.5
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../models/bge-reranker-base
        target: /task/models/bge-reranker-base
        read_only: true
        bind:
          create_host_path: false
