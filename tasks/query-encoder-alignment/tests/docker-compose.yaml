services:
  main:
    init: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${QUERY_ALIGNMENT_GPU_DEVICE:?Set the reserved GPU UUID or index}"]
              capabilities: [gpu]
    volumes:
      - type: bind
        source: ../data/corpus.jsonl
        target: /task/data/corpus.jsonl
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../data/doc.npy
        target: /task/data/doc.npy
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../models
        target: /task/models
        read_only: true
        bind:
          create_host_path: false
