[package]
name = "bm25-search"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
byteorder = "=1.5.0"
flate2 = "=1.1.0"
memmap2 = "=0.9.5"
rayon = "=1.10.0"
regex = "=1.11.1"
rust-stemmers = "=1.2.0"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
unicode-normalization = "=0.1.24"
zstd = "=0.13.3"

[profile.release]
lto = "thin"
codegen-units = 1
