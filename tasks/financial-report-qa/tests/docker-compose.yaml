services:
  main:
    cpu_period: 100000
    cpu_quota: 800000
    volumes:
      - type: bind
        source: ../data/corpus
        target: /tests/corpus
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../environment/docs
        target: /task/docs
        read_only: true
        bind:
          create_host_path: false
